# Render blueprint (alternative to Railway). Free plan has no persistent disk: data is lost on every
# deploy/restart. Use the Starter plan + disk below for a demo that keeps its data.
services:
  - type: web
    name: nidaan
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACKS
        value: gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3.6-flash
      - key: DATA_DIR
        value: /app/data
    disk:
      name: nidaan-data
      mountPath: /app/data
      sizeGB: 1
